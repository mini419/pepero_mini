<script>
(() => {
'use strict';
const COATS=[['milk','밀크','#855344'],['dark','다크','#4c302d'],['pink','딸기','#ec96a5'],['white','화이트','#fff0d3'],['matcha','말차','#83a989'],['blue','블루베리','#a19bcf'],['caramel','카라멜','#c89965']];
const TOPPINGS=[['crunch','크런치','🍪'],['sprinkle','스프링클','🌈'],['heart','하트','💗'],['star','별','⭐'],['nuts','견과','🥜'],['coconut','코코넛','❄️']];
const DRIZZLES=[['none','없음','🚫'],['white','화이트','🤍'],['dark','초코','🍫'],['pink','딸기','🩷']];
const BOXES=[['cream','버터크림','#edcaa9'],['pink','딸기우유','#f2adba'],['lilac','라벤더','#c9b4df'],['mint','민트','#a6cfc7'],['sky','소다','#a7c5e8'],['brown','초코','#b58a71']];
const STICKERS=['🐰','🧸','🐱','🐻','🎀','💝','🐣','🌷'];
const $=(q,root=document)=>root.querySelector(q);
const app=$('#app');
const plain=(x)=>String(x??'');
const s0=()=>({coat:'milk',toppings:['sprinkle'],drizzle:'white'});
const initial=()=>({v:1,sticks:Array.from({length:8},(_,i)=>({...s0(),coat:COATS[i%COATS.length][0],toppings:i%3===0?['heart']:i%3===1?['sprinkle']:['crunch'],drizzle:i%2?'white':'none'})),box:'pink',sticker:'🐰',bubble:'FOR YOU!',to:'',from:'',message:''});
let data=initial(),selected=0,shareUrl='',showRecipient=false,opened=false,timeoutId;
const coatColor=(code)=>COATS.find(v=>v[0]===code)?.[2]||COATS[0][2];
const boxColor=(code)=>BOXES.find(v=>v[0]===code)?.[2]||BOXES[0][2];
function escapeHTML(x){return plain(x).replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;').replaceAll('"','&quot;').replaceAll("'",'&#39;');}
function encode(x){let bytes=new TextEncoder().encode(JSON.stringify(x));let str='';for(let i=0;i<bytes.length;i++)str+=String.fromCharCode(bytes[i]);return btoa(str).replaceAll('+','-').replaceAll('/','_').replace(/=+$/,'');}
function decode(x){const base=x.replaceAll('-','+').replaceAll('_','/');const raw=atob(base);const bytes=Uint8Array.from(raw,c=>c.charCodeAt(0));return JSON.parse(new TextDecoder().decode(bytes));}
// Compact binary-safe share format. Older ?g= links remain readable.
const urlBase64=(bytes)=>{let binary='';for(const byte of bytes)binary+=String.fromCharCode(byte);return btoa(binary).replaceAll('+','-').replaceAll('/','_').replace(/=+$/,'');};
const readBase64=(b64)=>Uint8Array.from(atob(b64.replaceAll('-','+').replaceAll('_','/')),c=>c.charCodeAt(0));
function packGift(d){return [1,d.sticks.map(s=>[COATS.findIndex(c=>c[0]===s.coat),s.toppings.map(t=>TOPPINGS.findIndex(c=>c[0]===t)).join(''),DRIZZLES.findIndex(c=>c[0]===s.drizzle)]),BOXES.findIndex(c=>c[0]===d.box),STICKERS.includes(d.sticker)?STICKERS.indexOf(d.sticker):d.sticker,d.bubble,d.to,d.from,d.message];}
function unpackGift(p){if(!Array.isArray(p)||p.length!==8||p[0]!==1||!Array.isArray(p[1]))throw Error('invalid gift');return {v:1,sticks:p[1].map(s=>({coat:COATS[s[0]]?.[0],toppings:String(s[1]).split('').filter(Boolean).map(i=>TOPPINGS[Number(i)]?.[0]).filter(Boolean),drizzle:DRIZZLES[s[2]]?.[0]})),box:BOXES[p[2]]?.[0],sticker:typeof p[3]==='number'?STICKERS[p[3]]:p[3],bubble:p[4],to:p[5],from:p[6],message:p[7]};}
async function encodeShort(d){const input=new TextEncoder().encode(JSON.stringify(packGift(d)));if(typeof CompressionStream==='function'){try{const stream=new Blob([input]).stream().pipeThrough(new CompressionStream('gzip'));const packed=new Uint8Array(await new Response(stream).arrayBuffer());if(packed.length<input.length)return ['z',urlBase64(packed)];}catch(e){console.warn('압축을 사용할 수 없어 일반 링크로 생성합니다',e);}}return ['c',urlBase64(input)];}
async function decodeShort(type,b64){let bytes=readBase64(b64);if(type==='z'){if(typeof DecompressionStream!=='function')throw Error('unsupported browser');const stream=new Blob([bytes]).stream().pipeThrough(new DecompressionStream('gzip'));bytes=new Uint8Array(await new Response(stream).arrayBuffer());}return unpackGift(JSON.parse(new TextDecoder().decode(bytes)));}

function sanitize(obj){if(!obj||typeof obj!=='object')throw Error('invalid');const d=initial();let arr=Array.isArray(obj.sticks)?obj.sticks:[];if(arr.length===0&&obj.c){arr=Array.from({length:8},()=>({coat:obj.c}));}d.sticks=Array.from({length:8},(_,i)=>{const raw=arr[i]||s0();return {coat:COATS.some(v=>v[0]===raw.coat)?raw.coat:'milk',toppings:Array.isArray(raw.toppings)?raw.toppings.filter(t=>TOPPINGS.some(x=>x[0]===t)).slice(0,6):[],drizzle:DRIZZLES.some(v=>v[0]===raw.drizzle)?raw.drizzle:'none'};});d.box=BOXES.some(v=>v[0]===obj.box)?obj.box:'pink';d.sticker=STICKERS.includes(obj.sticker)?obj.sticker:(typeof obj.sticker==='string'&&obj.sticker.startsWith('data:image/')&&obj.sticker.length<80000?obj.sticker:'🐰');d.bubble=plain(obj.bubble).slice(0,10);d.to=plain(obj.to).slice(0,30);d.from=plain(obj.from).slice(0,30);d.message=plain(obj.message).slice(0,500);return d;}
function toast(text){const e=$('#toast');e.textContent=text;e.classList.add('show');clearTimeout(timeoutId);timeoutId=setTimeout(()=>e.classList.remove('show'),2700);}
function stickerHTML(){return data.sticker.startsWith('data:image/')?`<img src="${escapeHTML(data.sticker)}" alt="선택한 스티커"/>`:escapeHTML(data.sticker)}
function toppingMarkup(toppings,index){let result='';const coords=[[7,15],[17,29],[8,43],[16,60],[6,77],[17,92],[9,110],[15,125],[7,138]];const palette=['#ffebaa','#f6a1c3','#fffdf0','#bce1c4','#b7b1ec','#fff'];for(let i=0;i<coords.length;i++){const [x,y]=coords[i];const t=toppings[(i+index)%Math.max(1,toppings.length)];if(!t)break;let mark='';let c=palette[(i+index)%palette.length];if(t==='sprinkle'){mark=i%3===0?'━':i%3===1?'┃':'◆';}if(t==='heart'){mark='♥';c=i%2?'#ffe2ee':'#e67586';}if(t==='star'){mark='★';c='#ffed91';}if(t==='crunch'){mark='●';c='#f5d6aa';}if(t==='nuts'){mark='◆';c='#d6a97b';}if(t==='coconut'){mark='•';c='#fffdf0';}result+=`<span class="topping" style="left:${x}px;top:${y}px;--tc:${c};--sz:${t==='sprinkle'?9:t==='coconut'?18:11}px;--r:${(i*43)%90-45}deg">${mark}</span>`;}return result;}
function drizzleColor(x){return {white:'#fff1da',dark:'#51332c',pink:'#eea9bc'}[x]||'transparent'}
function giftStage(isRecipient=false){const rotations=[-16,-11,-7,-2,3,9,12,17];let sticks=data.sticks.map((st,i)=>`<button class="pepero-stick ${!isRecipient&&i===selected?'selected':''}" type="button" aria-label="${i+1}번 빼빼로 꾸미기" ${isRecipient?'tabindex="-1"':'data-stick="'+i+'"'} style="--x:${33+i*29}px;--rotation:${rotations[i]}deg"><span class="stick-cookie"></span><span class="stick-coated" style="--coat:${coatColor(st.coat)}">${st.drizzle!=='none'?`<span class="drizzle" style="--dr:${drizzleColor(st.drizzle)}"></span>`:''}${toppingMarkup(st.toppings,i)}</span></button>`).join('');return `<div class="stage ${isRecipient?'recipient-stage':''} ${opened?'opened':''}" id="stage" style="--box-color:${boxColor(data.box)}"><span class="doodle d1">✷</span><span class="doodle d2">♡</span><span class="doodle d3">✦</span><span class="doodle d4">✳</span><div class="shadow-ground"></div><div class="package-back"></div><div class="pepero-rack">${sticks}</div><div class="package-face"><div class="box-ribbon"></div>${data.bubble?`<div class="bubble">${escapeHTML(data.bubble)}</div>`:''}<div class="sticker">${stickerHTML()}</div></div>${isRecipient?`<div class="closed-cover"><div class="sticker">${stickerHTML()}</div><div class="cover-label">for ${escapeHTML(data.to||'you')} ♡</div></div>`:''}</div>`;}
function choiceButton(kind,code,name,icon,on){const dot=kind==='coat'?`<span class="dot" style="--dot:${coatColor(code)}"></span>`:`<span class="emoji">${icon}</span>`;return `<button type="button" class="choice ${on?'on':''}" data-choice="${kind}" data-value="${code}" aria-pressed="${on}">${dot}<span>${name}</span></button>`;}
function choices(){const st=data.sticks[selected];return `<section class="section"><div class="section-head"><h2>🍫 빼빼로 꾸미기</h2><span>${selected+1} / 8개 선택 중</span></div><label class="form-label">코팅 맛</label><div class="coatings">${COATS.map(([c,n])=>choiceButton('coat',c,n,null,st.coat===c)).join('')}</div><label class="form-label">토핑 <span style="font-size:11px;color:#b89788;font-weight:400">(여러 개 선택 가능)</span></label><div class="toppings">${TOPPINGS.map(([c,n,ic])=>choiceButton('topping',c,n,ic,st.toppings.includes(c))).join('')}</div><label class="form-label">드리즐</label><div class="drizzles">${DRIZZLES.map(([c,n,ic])=>choiceButton('drizzle',c,n,ic,st.drizzle===c)).join('')}</div></section>`}
function builder(){showRecipient=false;document.title='나만의 빼빼로 상자 🍫';app.innerHTML=`<div class="page"><nav class="nav"><div class="brand">🍫 달콤한 편지</div><small>만들고 · 꾸미고 · 선물하기</small></nav><header class="hero"><span class="eyebrow">A LITTLE SWEET SURPRISE</span><h1>나만의 빼빼로 상자 ♡</h1><p>빼빼로를 하나씩 꾸미고, 마음을 담아 선물해 보세요.</p></header><div class="shell"><div class="stage-panel"><div class="panel-top"><strong>🎁 나만의 선물 상자</strong><small>빼빼로를 눌러 선택해 주세요</small></div><div id="stageMount">${giftStage()}</div><p class="stage-caption">원하는 빼빼로를 톡! 눌러 꾸며보세요 ✨</p><div class="stage-actions"><button class="outline-button" type="button" id="random">🎲 랜덤 꾸미기</button><button class="outline-button" type="button" id="applyall">🍫 모두 똑같이</button></div></div><div class="settings-panel"><div id="choices">${choices()}</div><section class="section"><div class="section-head"><h2>🎀 상자 포장</h2><span>마지막은 예쁘게!</span></div><label class="form-label">포장지 색상</label><div class="swatches">${BOXES.map(([v,n,c])=>`<button type="button" class="swatch ${data.box===v?'on':''}" data-box="${v}" style="--swatch:${c}" title="${n}" aria-label="${n}" aria-pressed="${data.box===v}"></button>`).join('')}</div><label class="form-label">스티커</label><div class="stickers">${STICKERS.map(v=>`<button type="button" class="sticker-choice ${data.sticker===v?'on':''}" data-sticker="${v}" aria-label="${v} 스티커" aria-pressed="${data.sticker===v}">${v}</button>`).join('')}<label class="upload-label" title="직접 만든 이미지를 스티커로 사용">📷 내 사진 <input id="upload" type="file" accept="image/png,image/jpeg,image/webp,image/gif"></label></div><label class="form-label" for="bubble">말풍선 문구 <span style="font-weight:400;color:#b4958c">(최대 10자)</span></label><input class="field" id="bubble" maxlength="10" placeholder="예: 사랑해 ♡" value="${escapeHTML(data.bubble)}"/></section><section class="section"><div class="section-head"><h2>💌 마음을 담은 편지</h2><span>전하고 싶은 말</span></div><div class="names"><input class="field" id="to" maxlength="30" aria-label="받는 사람" placeholder="받는 사람" value="${escapeHTML(data.to)}"/><input class="field" id="from" maxlength="30" aria-label="보내는 사람" placeholder="보내는 사람" value="${escapeHTML(data.from)}"/></div><label class="form-label" for="message">편지 내용</label><textarea class="message" maxlength="500" id="message" placeholder="오늘 하루도 달콤하게 보내세요! 🍫\n전하고 싶은 이야기를 여기에 적어주세요.">${escapeHTML(data.message)}</textarea><div class="charcount"><span id="count">${data.message.length}</span>/500</div></section><button class="make-button" id="make" type="button">💝 선물 링크 만들기</button><div class="result" id="result"><h3>🎉 선물 링크가 완성됐어요!</h3><p>압축해서 만든 선물 주소입니다. 친구가 링크를 열고 선물 상자를 누르면 빼빼로와 편지가 나타납니다.</p><div class="result-link"><input class="field" id="sharelink" aria-label="공유 링크" readonly/><button class="outline-button" id="copy" style="flex:0 0 auto">복사</button></div><div class="mini-buttons"><button id="preview" type="button">🎁 받는 화면 미리보기</button><button id="nativeShare" type="button">↗ 공유하기</button></div></div><p class="hint">※ 선물 정보를 압축해 링크에 담습니다. 사진을 추가하면 링크가 길어질 수 있습니다. 편지 내용은 암호화되지 않습니다.</p></div></div><footer class="footer">Made with ♡ · 달콤한 편지</footer></div>`;bindBuilder();}
function refreshStage(){const target=$('#stageMount');if(target)target.innerHTML=giftStage();}
function refreshChoices(){const target=$('#choices');if(target)target.innerHTML=choices();}
function updateBoxUI(){refreshStage();document.querySelectorAll('[data-box]').forEach(btn=>{btn.classList.toggle('on',btn.dataset.box===data.box);btn.setAttribute('aria-pressed',btn.dataset.box===data.box)});document.querySelectorAll('[data-sticker]').forEach(btn=>{btn.classList.toggle('on',btn.dataset.sticker===data.sticker);btn.setAttribute('aria-pressed',btn.dataset.sticker===data.sticker)});}
function bindBuilder(){app.onclick=handleBuilderClick;['bubble','to','from','message'].forEach(key=>{const element=$('#'+key);element?.addEventListener('input',()=>{data[key]=element.value; if(key==='bubble')refreshStage();if(key==='message')$('#count').textContent=data.message.length;});});$('#upload')?.addEventListener('change',handleUpload);}
function handleBuilderClick(e){if(showRecipient)return;let t=e.target.closest('button');if(!t)return;if(t.dataset.stick!==undefined){selected=Number(t.dataset.stick);refreshStage();refreshChoices();return;}if(t.dataset.choice){const {choice,value}=t.dataset;let st=data.sticks[selected];if(choice==='coat')st.coat=value;if(choice==='drizzle')st.drizzle=value;if(choice==='topping'){st.toppings=st.toppings.includes(value)?st.toppings.filter(v=>v!==value):[...st.toppings,value];}refreshStage();refreshChoices();return;}if(t.dataset.box){data.box=t.dataset.box;updateBoxUI();return;}if(t.dataset.sticker){data.sticker=t.dataset.sticker;updateBoxUI();return;}switch(t.id){case 'random':data.sticks.forEach(st=>{st.coat=COATS[Math.floor(Math.random()*COATS.length)][0];st.drizzle=DRIZZLES[Math.floor(Math.random()*DRIZZLES.length)][0];st.toppings=[TOPPINGS[Math.floor(Math.random()*TOPPINGS.length)][0]];});refreshStage();refreshChoices();toast('8개 모두 랜덤으로 꾸몄어요!');break;case 'applyall':data.sticks=Array.from({length:8},()=>({...data.sticks[selected],toppings:[...data.sticks[selected].toppings]}));refreshStage();refreshChoices();toast('선택한 빼빼로와 똑같이 만들었어요!');break;case 'make':makeLink();break;case 'copy':copyLink();break;case 'nativeShare':share();break;case 'preview':if(shareUrl){if(location.protocol==='http:'||location.protocol==='https:')history.replaceState(null,'',new URL(shareUrl).pathname+new URL(shareUrl).search);recipient();window.scrollTo({top:0,behavior:'smooth'})}break;}}
function handleUpload(event){const file=event.target.files?.[0];if(!file)return;if(!file.type.startsWith('image/')){toast('이미지 파일을 선택해 주세요.');return;}if(file.size>15*1024*1024){toast('15MB 이하의 사진을 선택해 주세요.');return;}const reader=new FileReader();reader.onload=()=>{const img=new Image();img.onload=()=>{const canvas=document.createElement('canvas');const w=96,h=96;canvas.width=w;canvas.height=h;const ctx=canvas.getContext('2d');ctx.fillStyle='#fff';ctx.fillRect(0,0,w,h);const scale=Math.max(w/img.width,h/img.height);const iw=img.width*scale,ih=img.height*scale;ctx.drawImage(img,(w-iw)/2,(h-ih)/2,iw,ih);data.sticker=canvas.toDataURL('image/jpeg',0.5);refreshStage();toast('내 이미지가 스티커로 적용됐어요!');};img.onerror=()=>toast('이미지를 열 수 없습니다.');img.src=reader.result;};reader.readAsDataURL(file);}
async function makeLink(){if(!data.to.trim()||!data.from.trim()||!data.message.trim()){toast('받는 사람, 보내는 사람, 편지를 모두 입력해 주세요.');return;}const url=new URL(location.href);url.search='';url.hash='';const [key,value]=await encodeShort(data);url.searchParams.set(key,value);shareUrl=url.href;const result=$('#result');result.classList.add('show');$('#sharelink').value=shareUrl;result.scrollIntoView({behavior:'smooth',block:'nearest'});if(shareUrl.length>3000)toast('사진이 포함되어 링크가 길어요. 이모지 스티커를 추천해요.');else toast('짧아진 선물 링크가 완성됐어요!');}
async function copyLink(){try{await navigator.clipboard.writeText(shareUrl);toast('링크를 복사했습니다!');}catch{const input=$('#sharelink');input.select();input.setSelectionRange(0,input.value.length);try{document.execCommand('copy');toast('링크를 복사했습니다!');}catch{toast('링크를 직접 선택해 복사해 주세요.');}}}
async function share(){if(navigator.share){try{await navigator.share({title:'달콤한 빼빼로 선물 💝',text:`${data.to}님께 도착한 선물이에요!`,url:shareUrl});}catch(e){if(e.name!=='AbortError')copyLink();}}else copyLink();}
function confetti(){const emojis=['💗','🎀','✨','🍫','💝','🌸','♡','⭐'];for(let i=0;i<30;i++){const node=document.createElement('div');node.className='confetti';node.textContent=emojis[i%emojis.length];node.style.left=Math.random()*100+'vw';node.style.animationDuration=(2.1+Math.random()*2)+'s';node.style.animationDelay=(Math.random()*.55)+'s';node.style.opacity=String(.55+Math.random()*.45);node.style.fontSize=(11+Math.random()*13)+'px';document.body.append(node);setTimeout(()=>node.remove(),5000);}}
function recipient(){showRecipient=true;opened=false;document.title=`${data.to||'친구'}님께 도착한 빼빼로 선물 🎁`;app.innerHTML=`<div class="page recipient-wrap"><nav class="nav"><div class="brand">🍫 달콤한 편지</div><small>마음이 도착했어요 ♡</small></nav><header class="hero"><span class="eyebrow">YOU'VE GOT A SWEET GIFT!</span><h1>달콤한 선물이 도착했어요 ♡</h1><p><strong>${escapeHTML(data.from||'누군가')}</strong>님이 보내신 작은 선물을 열어보세요.</p></header><div class="stage-panel recipient-card"><div class="gift-title">🎁 ${escapeHTML(data.to||'당신')}님에게</div>${giftStage(true)}<p id="recipientHint" class="recipient-info">두근두근! 아래 버튼을 누르면 상자가 열려요.</p><div class="recipient-buttons"><button class="make-button" id="openGift" type="button">🎁 뚜껑 열기</button></div><div class="letter" id="letter"><div class="to">To. ${escapeHTML(data.to||'당신')}</div><div class="body">${escapeHTML(data.message||'달콤한 하루 보내세요! 💗')}</div><div class="from">From. ${escapeHTML(data.from||'누군가')}</div></div><div class="mini-buttons hide" id="afterActions"><button type="button" id="closeGift">🎁 선물 다시 보기</button><button type="button" id="newGift">✏️ 나도 선물 만들기</button></div></div><div class="recipient-info">이 선물은 마음을 담아 만든 디지털 빼빼로 편지입니다. 💌</div><footer class="footer">Made with ♡ · 달콤한 편지</footer></div>`;const openButton=$('#openGift');openButton.onclick=()=>{if(opened)return;opened=true;$('#stage').classList.add('opened');openButton.classList.add('hide');$('#recipientHint').textContent='선물 상자를 열었어요! 마음이 담긴 편지를 읽어보세요. 💌';confetti();setTimeout(()=>{$('#letter')?.classList.add('visible');$('#afterActions')?.classList.remove('hide');$('#letter')?.scrollIntoView({behavior:'smooth',block:'nearest'});},650)};$('#closeGift').onclick=()=>{recipient();window.scrollTo({top:0,behavior:'smooth'});};$('#newGift').onclick=()=>{data=initial();selected=0;const cleanUrl=new URL(location.href);cleanUrl.search='';cleanUrl.hash='';history.replaceState(null,'',cleanUrl.href);builder();window.scrollTo({top:0,behavior:'smooth'});};}
async function boot(){const params=new URLSearchParams(location.search);const key=['z','c','g'].find(k=>params.has(k));if(key){try{const payload=params.get(key);const gift=key==='g'?decode(payload):await decodeShort(key,payload);data=sanitize(gift);recipient();return;}catch(e){console.warn('링크 정보를 읽을 수 없음',e);history.replaceState(null,'',location.pathname);toast('선물 링크를 읽을 수 없어 새 선물 만들기로 이동했어요.');}}builder();}
boot();
})();
</script>
